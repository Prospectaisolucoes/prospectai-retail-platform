name: Pipeline validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate committed CSV sample and payment accounting
        run: |
          python -m prospectai.pipeline load --input data/sample --db warehouse/sample.db
          python - <<'PY'
          import sqlite3
          con = sqlite3.connect('warehouse/sample.db')
          for view in ('gold_daily_sales', 'gold_category_sales', 'gold_region_sales'):
              orders, revenue = con.execute(f'SELECT SUM(orders), SUM(revenue_cents) FROM {view}').fetchone()
              assert (orders, revenue) == (3923, 595079970), (view, orders, revenue)
          assert con.execute('SELECT COUNT(*) FROM rejects').fetchone()[0] == 1
          assert con.execute('SELECT COUNT(*) FROM silver_payments').fetchone()[0] == 6106
          assert con.execute('SELECT COUNT(*) FROM silver_customers').fetchone()[0] == 500
          assert con.execute('SELECT COUNT(*) FROM silver_products').fetchone()[0] == 120
          assert con.execute('SELECT COUNT(*) FROM silver_orders').fetchone()[0] == 5000
          assert con.execute('SELECT COUNT(*) FROM (SELECT order_id FROM silver_payments WHERE payment_status="paid" GROUP BY order_id HAVING COUNT(*) > 1)').fetchone()[0] == 1106
          print('Retail dataset validated: 5000 orders, 6106 payments, 1 orphan rejected')
          PY
      - name: Generate synthetic dataset
        run: python -m prospectai.pipeline generate --output data/synthetic --orders 1000 --seed 42
      - name: Execute Bronze Silver Gold pipeline
        run: python -m prospectai.pipeline load --input data/synthetic --db warehouse/retail.db
      - name: Export Power BI datasets
        run: python -m prospectai.pipeline export --db warehouse/retail.db --output output/gold
      - name: Validate Gold reconciliation
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          totals = []
          for name in ('gold_daily_sales', 'gold_category_sales', 'gold_region_sales'):
              with (Path('output/gold') / f'{name}.csv').open(newline='') as f:
                  rows = list(csv.DictReader(f))
              totals.append((sum(int(r['orders']) for r in rows), sum(int(r['revenue_cents']) for r in rows)))
          assert len(set(totals)) == 1, totals
          assert totals[0][0] > 0 and totals[0][1] > 0, totals
          print('Gold reconciliation OK:', totals[0])
          PY
      - name: Upload BI-ready exports
        uses: actions/upload-artifact@v4
        with:
          name: prospectai-gold-csv
          path: output/gold/*.csv
